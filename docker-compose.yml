services:
  postgres:
    image: postgres:16-alpine
    container_name: eoda_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eoda
      POSTGRES_PASSWORD: eoda_dev
      POSTGRES_DB: eoda_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eoda -d eoda_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
