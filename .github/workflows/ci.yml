name: CI

on:
  push:
    branches: [main, develop]
  # `develop` aussi (23/10/2026) : une PR vers develop n'était vérifiée qu'APRÈS sa
  # fusion — la PR #26 paraissait verte (Vercel seul) et develop est passée au rouge.
  pull_request:
    branches: [main, develop]

# Le jeton du runner ne fait que LIRE le dépôt (28/10/2026, audit après les vers npm
# ChainDrop / Shai-Hulud, qui volent les jetons de CI pour publier et pousser) : sans ce
# bloc, il hérite des droits par défaut du dépôt, écriture comprise.
permissions:
  contents: read

env:
  # CI utilise PostgreSQL local — Prisma Postgres pour dev/prod (voir .env.example)
  DATABASE_URL: postgresql://eoda:eoda_dev@localhost:5432/eoda_test?pgbouncer=true&connection_limit=1
  DIRECT_URL: postgresql://eoda:eoda_dev@localhost:5432/eoda_test
  AUTH_SECRET: ci-test-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  ci:
    name: Secrets · Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    # Un run complet dure ~4-5 min. Sans plafond, une étape bloquée (les migrations sur
    # main, 22/10/2026) occupait le runner 47 min avant d'échouer sans journal.
    timeout-minutes: 20

    services:
      postgres:
        # pgvector/pgvector, pas postgres:16-alpine : la migration
        # 20260906220000_knowledge_chunks fait `CREATE EXTENSION vector`, absente de
        # l'image Postgres standard. Image officielle pgvector, même version majeure.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eoda
          POSTGRES_PASSWORD: eoda_dev
          POSTGRES_DB: eoda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions épinglées sur un COMMIT (28/10/2026) : une étiquette « v4 » se déplace, et
      # une action compromise s'exécute avec le dépôt et ses secrets. Mettre à jour = changer
      # le SHA, en relisant ce qui a changé.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historique complet — gitleaks analyse les commits, pas seulement l'arbre.
          fetch-depth: 0

      # Analyse de secrets AVANT tout le reste : un secret commité doit être signalé
      # même si le reste du pipeline échoue. Binaire installé directement plutôt que
      # via l'action officielle, qui exige une clé de licence pour une organisation.
      - name: Détection de secrets (gitleaks)
        run: |
          GITLEAKS_VERSION=8.24.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Empreinte officielle de la version (gitleaks_8.24.0_checksums.txt) : un binaire
          # modifié en route ne s'exécute pas avec le dépôt (28/10/2026).
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Échoue sur une vulnérabilité haute ou critique. Pas de `|| true` : une étape
      # de qualité qui ne peut pas échouer transforme la CI en théâtre.
      #
      # Passe par un script parce que `pnpm audit` sort en code 1 dans DEUX cas qui
      # n'ont rien à voir : une vulnérabilité trouvée, et un registre npm injoignable
      # (`ERR_SOCKET_TIMEOUT`, constaté le 04/09/2026). Le second se réessaie ; les
      # confondre apprend à ignorer les échecs de cette étape, ce qui revient au
      # `|| true` en un peu plus long.
      - name: Audit des dépendances
        run: node scripts/audit-dependencies.mjs

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Tests unitaires des services purs — moteur de cotation HAS, périmètre des
      # offres, validation des fichiers déposés, parseurs d'entrée. Aucune BDD requise.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Budget de JavaScript par route (convention P9). Placé APRÈS la construction :
      # il lit le manifeste qu'elle produit. Il SORT EN CODE 1 au-dessus du budget —
      # un budget qui avertit sans bloquer est un indicateur, pas un garde-fou.
      - name: Budget de paquet
        run: pnpm --filter @eoda/web check:bundle

      # Une page pré-rendue ne peut pas porter le nonce tiré à chaque requête : ses
      # <script> seraient tous refusés par la CSP et la page ne s'hydraterait jamais.
      # Contrôle du HTML réellement produit, pas du réglage déclaré.
      - name: CSP à nonce applicable
        run: pnpm --filter @eoda/web check:csp

      # @sparticuz/chromium situe son binaire à l'exécution : le traçage ne l'embarque
      # pas sans `outputFileTracingIncludes`, et l'aperçu des documents répondait 503 en
      # production (21/10/2026). Contrôle des traces réellement produites.
      - name: Binaire Chromium embarqué
        run: pnpm --filter @eoda/web check:chromium
