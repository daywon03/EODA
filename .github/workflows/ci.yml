name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # CI utilise PostgreSQL local — Supabase pour dev/prod (voir .env.example)
  DATABASE_URL: postgresql://eoda:eoda_dev@localhost:5432/eoda_test?pgbouncer=true&connection_limit=1
  DIRECT_URL: postgresql://eoda:eoda_dev@localhost:5432/eoda_test
  AUTH_SECRET: ci-test-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eoda
          POSTGRES_PASSWORD: eoda_dev
          POSTGRES_DB: eoda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
