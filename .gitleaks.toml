# Configuration gitleaks du dépôt.
#
# ⚠️ Toute entrée d'exception ci-dessous doit être JUSTIFIÉE PAR ÉCRIT et portée sur
# une empreinte précise, jamais sur un chemin ou un dossier entier. Une exception
# large exempterait aussi le vrai secret qu'on y déposera un jour par accident — et
# une allowlist qui grossit finit par masquer une fuite réelle.
#
# En cas de doute : ne pas ajouter d'exception, corriger la donnée.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  # Faux positif confirmé le 23/08/2026. Le prototype HTML de pilotage des missions
  # — le document de référence à partir duquel la partie commerciale de la
  # plateforme est spécifiée — déclare `const STORAGE_KEY = 'eoda_pilotage_missions_v1'`.
  # C'est un NOM DE CLÉ localStorage, visible de quiconque ouvre le fichier dans un
  # navigateur : il n'ouvre aucun accès et ne peut rien déverrouiller. Le détecteur
  # réagit au mot « KEY » suivi d'une chaîne assez longue.
  #
  # `condition = "AND"` est OBLIGATOIRE ici. Par défaut gitleaks combine les critères
  # d'une allowlist en OU : `paths` seul aurait exempté le fichier ENTIER, y compris
  # un vrai secret collé dedans plus tard. Avec ET, seule cette chaîne précise, dans
  # ce fichier précis, est ignorée.
  condition = "AND"
  paths = ['''\.claude/context/Documents/20260621_OUTIL_EODA_Pilotage-Missions_v02_Interne\.html''']
  regexes = ['''eoda_pilotage_missions_v1''']
